<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    
    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-container">

    <h1 style="text-align: center;">CRM OPs</h1>

    <h1>Iniciar Sesión</h1>

        
            <p class="login-error">
                {{ error }}
            </p>
        

    <form method="POST" class="login-form">

        <input type="text"
                name="username"
                placeholder="Usuario"
                required>

        <input type="password"
                name="password"
                placeholder="Contraseña"
                required>

        <button type="submit">
            Ingresar
        </button>

    </form>

</div>

</body>

</html>
